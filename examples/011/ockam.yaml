name: example011
pods:
  - name: main-pod
    size: big
    public: true
    containers:
      - name: main
        image: main
        env:
          BOX_CLIENT_ID: secrets.BOX_CLIENT_ID
          BOX_CLIENT_SECRET: secrets.BOX_CLIENT_SECRET
          BOX_ENTERPRISE_ID: secrets.BOX_ENTERPRISE_ID

  - name: runner-pod
    size: big
    clones: 5
    containers:
      - name: runner
        image: runner
        env:
          BOX_CLIENT_ID: secrets.BOX_CLIENT_ID
          BOX_CLIENT_SECRET: secrets.BOX_CLIENT_SECRET
          BOX_ENTERPRISE_ID: secrets.BOX_ENTERPRISE_ID
