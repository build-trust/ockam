<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title></title>
        <style>
            body {
                font-family: sans-serif;
                margin: 0;
                overflow-y: auto;
                overflow-x: auto;
                height: 100vh;
            }
            #container {
                white-space: nowrap;
                overflow-y: visible;
                overflow-x: visible;
                padding: 10px;
                box-sizing: border-box;
                display: flex;
                flex-wrap: nowrap;
                align-items: flex-start;
                height: auto;
            }
            .node-column {
                display: inline-block;
                vertical-align: top;
                margin-right: 6px;
                margin-bottom: 10px;
                background: #fff;
                padding: 4px 2px 6px;
                box-sizing: content-box;
                width: max-content;
            }
            .node-label {
                text-align: center;
                font-weight: bold;
                margin-bottom: 6px;
                font-size: 12px;
                white-space: normal;
                width: 100%;
                position: sticky;
                top: 0;
                background: #fff;
                z-index: 10;
            }
            svg {
                display: block;
                background: #fff;
            }
            button {
                margin: 10px;
                padding: 6px 12px;
                font-size: 14px;
            }
            #loader {
                display: none;
                width: 15px;
                height: 15px;
                margin: 0;
                border: 8px solid #f3f3f3;
                border-radius: 50%;
                border-top: 8px solid #3498db;
                -webkit-animation: spin 2s linear infinite;
                animation: spin 2s linear infinite;
            }
            @-webkit-keyframes spin {
                0% { -webkit-transform: rotate(0deg); }
                100% { -webkit-transform: rotate(360deg); }
            }
            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
            .foo {
                display: flex;
                flex-direction: row;
                justify-content: flex-start;
                align-items: center;
            }
            #popup {
                display: none;
                background-color: rgba(0,0,0,0.5);
                position: fixed;
                z-index: 999;
                width: 100%;
                height: 100vh;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                margin: 0 auto;
                .popup {
                    background: white;
                    color: #fff;
                    padding: 10px;
                    border-radius: 5px;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    width: 200px;
                    #text {
                        color: black;
                    }
                }
            }
        </style>
    </head>
    <body>
        <div id="popup">
            <div class="popup">
              <p id="text"></p>
              <button id="ok-btn">OK</button>
            </div>
        </div>
        <div class="foo">
          <button id="run-btn">Run</button>
          <div id="loader"></div>
        </div>
        <div id="container"></div>
        <script src="https://d3js.org/d3.v7.min.js"></script>
        <script>
            const circleDiameter = 6;
            const circleMargin = 3;
            const perRow = 16;

            const container = d3.select("#container");

            function sleep(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            window.prev_data = {};
            function render(data) {
                const container = d3.select("#container");

                // In case some runners didn't respond due to being buse, use the previous value for that runner
                const new_data = {...window.prev_data, ...data};
                window.prev_data = {...data};

                const data_list = Object.entries(new_data).sort((a, b) => {
	                  return a[0].localeCompare(b[0]);
                });

                const nodeColumns = container.selectAll(".node-column").data(data_list, (d) => d[0]);
                nodeColumns.exit().remove();

                const nodeColumnsEnter = nodeColumns.enter().append("div").attr("class", "node-column");
                nodeColumnsEnter.append("div").attr("class", "node-label");
                nodeColumnsEnter.append("svg");

                const nodeColumnsMerge = nodeColumnsEnter.merge(nodeColumns);
                nodeColumnsMerge.each(function ([nodeName, workers]) {
                    const rowCount = Math.ceil(workers.length / perRow);
                    const svgWidth = perRow * (circleDiameter + circleMargin) + circleMargin;
                    const svgHeight = rowCount * (circleDiameter + circleMargin) + circleMargin;

                    const nodeDiv = d3.select(this);
                    nodeDiv.select(".node-label").text(nodeName.split("-").slice(2).join("-"));
                    nodeDiv.style("width", svgWidth + "px");
                    const svg = nodeDiv.select("svg").attr("width", svgWidth).attr("height", svgHeight);

                    const circles = svg.selectAll("circle").data(workers, (d) => d);
                    circles.exit().remove();

                    const circlesEnter = circles.enter().append("circle");
                    const circlesMerge = circlesEnter.merge(circles);
                    circlesMerge
                        .attr(
                            "cx",
                            (d, i) =>
                                (i % perRow) * (circleDiameter + circleMargin) + circleMargin + circleDiameter / 2,
                        )
                        .attr(
                            "cy",
                            (d, i) =>
                                Math.floor(i / perRow) * (circleDiameter + circleMargin) +
                                circleMargin +
                                circleDiameter / 2,
                        )
                        .attr("r", circleDiameter / 2)
                        .attr("fill", (d) => "#" + d.slice(0, 6))
                        .on("mouseenter", function (event, d) {
                            d3.select(this)
                                .raise()
                                .transition()
                                .duration(300)
                                .attr("r", 3 * circleDiameter);
                        })
                        .on("mouseleave", function (event, d) {
                            d3.select(this)
                                .transition()
                                .duration(300)
                                .attr("r", circleDiameter / 2);
                        })
                        .on("click", function (event, d) {
                            run(nodeName, d);
                        });

                    circles.select("title").remove();
                    circlesMerge.append("title").text((d) => d);
                });
            }

            document.getElementById("ok-btn").addEventListener("click", async function () {
                const popup = document.getElementById("popup");
                popup.style.display = "none"
            });

            document.getElementById("run-btn").addEventListener("click", async function () {
                const button = this;
                const loader = document.getElementById("loader");
                const popup = document.getElementById("popup");
                const text = document.getElementById("text");
                button.disabled = true;
                loader.style.display = "block";

                try {
                    const start = Date.now();
                    const response = await fetch("/analyze", { method: "POST" });
                    const response_json = await response.json();
                    const end = Date.now();
                    console.log("Analysis: ", response_json);
                    text.innerHTML = `Success in: ${Math.floor((end - start) / 1000)} s`;
                } catch (error) {
                    console.error("Error fetching /analyze:", error);
                    text.innerHTML = "Error"
                } finally {
                    loader.style.display = "none";
                    await sleep(1500);
                    popup.style.display = "flex"
                    button.disabled = false;
                }
            });

            async function fetchWorkers() {
                while (true) {
                    try {
                        const response = await fetch("/runners/workers");
                        if (response.ok) {
                            const response_json = await response.json();
                            const now = new Date();
                            console.log(now.toLocaleTimeString(), "Workers:", response_json);
                            render(response_json);
                        }
                    } catch (e) {
                        console.error("Error fetching /runners/workers:", e);
                    }
                    await new Promise((r) => setTimeout(r, 200));
                }
            }

            fetchWorkers();
        </script>
    </body>
</html>
