<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        margin: 10% 15%;
        line-height: 1.8;
        overflow-y: scroll;
        overflow-x: hidden;
        font: 21px "Courier New", Courier, monospace;
        padding: 0;
      }

      main {
        max-width: 1080px;
        margin: 0 auto;
        padding: 3rem 1rem;
      }

      pre {
        padding-top: 30px;
        box-sizing: border-box;
        white-space: pre-wrap;
        overflow-wrap: break-word;
      }

      textarea {
        width: 100%;
        max-width: 1080px;
        box-sizing: border-box;
        border: 1px solid #e9e9e9;
        border-radius: 5px;
        box-shadow: 2px 2px 10px #f4f4f4;
        font-size: inherit;
        padding: 1rem;
        display: block;
        height: calc(3 * 1.8em + 14.8px);
      }
    </style>
    <title></title>
  </head>
  <body>
    <main>
      <textarea id="in" autofocus placeholder="How can I help you..."></textarea>
      <pre id="out"></pre>
    <main>

    <script>
      async function appendCharByChar(text, delay = 5) {
        for (const char of text) {
          out.textContent += char;
          await new Promise(resolve => setTimeout(resolve, delay));
        }
      }

      async function send(message) {
        const input = document.getElementById("in");
        input.disabled = true;

        const out = document.getElementById("out");
        out.textContent = "";

        const response = await fetch("/agents/henry", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: message }),
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let done = false;

        while (!done) {
          const { value, done: doneReading } = await reader.read();
          done = doneReading;
          if (value) {
            const decoded = decoder.decode(value, { stream: false });
            const messages = JSON.parse(decoded)

            console.log(messages)
            for (const { content } of messages) {
              console.log(content)
              if (content) await appendCharByChar(content);
            }
          }
        }

        input.disabled = false;
        input.focus();
      }

      document.getElementById("in").addEventListener("keydown", async e => {
        if (e.key === "Enter" && !e.shiftKey && !e.target.disabled && e.target.value.trim()) {
          e.preventDefault();
          await send(e.target.value);
        }
      });
    </script>
  </body>
</html>
