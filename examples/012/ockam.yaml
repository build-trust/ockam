name: example012
pods:
  - name: main-pod
    public: true
    containers:
      - name: main
        image: main

      - name: mcp
        image: ghcr.io/build-trust/mcp-proxy
        env:
          - FIRECRAWL_API_KEY: secrets.FIRECRAWL_API_KEY
        args: ["--sse-port", "8001", "--pass-environment", "--", "npx", "-y", "firecrawl-mcp"]
