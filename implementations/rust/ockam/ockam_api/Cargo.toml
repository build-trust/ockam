[package]
name = "ockam_api"
version = "0.100.0"
authors = ["Ockam Developers"]
categories = [
  "cryptography",
  "asynchronous",
  "authentication",
  "network-programming",
  "embedded",
]
edition = "2021"
homepage = "https://github.com/ockam-network/ockam"
keywords = [
  "ockam",
  "crypto",
  "cryptography",
  "network-programming",
  "encryption",
]
license = "Apache-2.0"
publish = true
repository = "https://github.com/ockam-network/ockam/implementations/rust/ockam/ockam_api"
description = "Ockam's request-response API"

[features]
default = ["std", "rust-crypto", "privileged_portals"]
test-utils = []
std = [
  "either/use_std",
  "hex/std",
  "minicbor/std",
  "ockam_abac/std",
  "ockam_core/std",
  "ockam/std",
  "ockam_multiaddr/std",
  "ockam_node/std",
  "ockam_vault/std",
  "ockam_vault_aws/std",
  "tracing/std",
  "storage",
]
storage = ["ockam/storage"]
aws-lc = ["ockam_vault/aws-lc", "ockam_transport_tcp/aws-lc"]
rust-crypto = ["ockam_vault/rust-crypto", "ockam_transport_tcp/ring"]
privileged_portals = ["ockam_transport_tcp/privileged_portals"]
encode_format = ["clap"]
ui = ["encode_format", "r3bl_rs_utils_core", "r3bl_tui", "r3bl_tuify"]

[[bin]]
name = "node_control_api_schema"
path = "src/control_api/exporter.rs"

[build-dependencies]
cfg_aliases = "0.2.1"

[dependencies]
base64-url = "3.0.0"
bytes = { version = "=1.11.1", default-features = false, features = ["serde"] }
cfg-if = "1.0.0"
chrono = { version = "0.4" }
clap = { version = "4.5", default-features = false, features = ["derive", "std"], optional = true }
colorful = "0.3"
colors-transform = "0.2"
dialoguer = "0.11"
either = { version = "1.13.0", default-features = false }
futures = { version = "0.3.30", features = [] }
futures-core = "0.3.31"
gethostname = "0.5.0"
hex = { version = "0.4.3", default-features = false, features = ["alloc", "serde"] }
home = "0.5"
http = "1"
http-body-util = "0"
httparse = "1.9.5"
hyper = { version = "1", default-features = false, features = ["server", "http1", "client"] }
hyper-util = { version = "0", default-features = false, features = ["server", "http1", "tokio"] }
indicatif = "0.17"
itertools = "0.14.0"
jaq-core = "1"
jaq-interpret = "1"
jaq-parse = "1"
jaq-std = "1"
kafka-protocol = "0.14"
miette = { version = "7.2.0", features = ["fancy-no-backtrace"] }
minicbor = { version = "0.26.3", default-features = false, features = ["alloc", "derive"] }
nix = { version = "0.29", features = ["signal"] }
nu-ansi-term = "0.50"
once_cell = { version = "1", default-features = false }
open = "5.3.0"
opentelemetry = { version = "0.27", features = ["logs", "metrics", "trace"] }
opentelemetry-appender-tracing = { version = "0.27" }
opentelemetry-otlp = { version = "0.27", features = ["logs", "metrics", "trace", "grpc-tonic", "gzip-tonic", "tls", "tls-roots", "hyper-client"], default-features = false }
opentelemetry-proto = { version = "0.27", features = ["full"] }
opentelemetry-semantic-conventions = { version = "0.28", features = ["semconv_experimental"] }
opentelemetry_sdk = { version = "0.27", features = ["logs", "metrics", "trace", "rt-tokio", "rt-tokio-current-thread", "testing"], default-features = false }
petname = { version = "2.0.2", default-features = false, features = ["default-rng", "default-words"] }
r3bl_rs_utils_core = { version = "0.9", optional = true }
r3bl_tui = { version = "0.5", optional = true }
r3bl_tuify = { version = "0.1", optional = true }
rand = "0.8"
regex = "1.10.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.133"
sha2 = "0.10.8"
sqlx = { version = "0.8.3", default-features = false }
sqlx-core = { version = "0.8.3", default-features = false }
strip-ansi-escapes = "0.2"
strum = { version = "0.26.3", default-features = false, features = ["derive"] }
subtle = "2"
syntect = { version = "5.2.0", default-features = false, features = ["default-syntaxes", "regex-onig"] }
sysinfo = "0.32"
termbg = "0.5.2"
thiserror = "2.0.9"
time = { version = "=0.3.47", default-features = false, features = ["std", "formatting", "local-offset", "macros"] }
tiny_http = "0.12.0"
tokio = { version = "1.43.1", features = ["full"] }
tokio-retry = "0.3.0"
tracing = { version = "0.1", default-features = false }
tracing-appender = "0.2.2"
tracing-core = { version = "0.1.32", default-features = false }
tracing-error = "0.2.0"
tracing-opentelemetry = "0.28"
tracing-subscriber = { version = "0.3", features = ["json"] }
url = "2.5.2"
utoipa = { version = "^5.3", features = ["yaml", "openapi_extensions", "non_strict_integers"] }

ockam_multiaddr = { path = "../ockam_multiaddr", version = "0.71.0", features = ["cbor", "serde"] }
ockam_transport_core = { path = "../ockam_transport_core", version = "^0.104.0" }
ockam_transport_tcp = { path = "../ockam_transport_tcp", version = "^0.140.0", default-features = false, features = ["std"] }
tonic = { version = "0.12", features = ["default", "gzip"] }

[dependencies.ockam_core]
version = "0.126.0"
path = "../ockam_core"
default-features = false
features = ["no_std", "alloc"]

[dependencies.ockam_node]
version = "0.142.0"
path = "../ockam_node"
default-features = false
features = ["no_std", "alloc"]

[dependencies.ockam_vault]
version = "0.136.0"
path = "../ockam_vault"
default-features = false
# FIXME: ockam_vault's dependency curve25519-dalek has non-additive features which
# breaks building ockam_vault with feature set "no_std,std":
features = ["std", "storage"]

[dependencies.ockam_vault_aws]
version = "0.62.0"
path = "../ockam_vault_aws"
default-features = false
features = ["std"]

[dependencies.ockam]
version = "^0.157.0"
path = "../ockam"
default-features = false
features = ["std", "ockam_transport_tcp", "ockam_transport_udp", "storage"]

[dependencies.ockam_abac]
version = "0.84.0"
path = "../ockam_abac"
default-features = false

[dev-dependencies]
cddl-cat = "0.6.1"
hex = "0.4.3"
hyper = { version = "1", default-features = false, features = ["server", "http1", "client"] }
multimap = "0.10.0"
ockam_macros = { path = "../ockam_macros", features = ["std"], version = "^0.39.0" }
ockam_transport_core = { path = "../ockam_transport_core", version = "^0.104.0" }
ockam_transport_tcp = { path = "../ockam_transport_tcp", default-features = false, version = "^0.140.0" }
opentelemetry_sdk = { version = "0.27", features = ["logs", "metrics", "trace", "rt-tokio", "testing"], default-features = false }
quickcheck = "1.0.1"
quickcheck_macros = "1.0.0"
serial_test = "3.0.0"
tempfile = "3.17.1"
tokio = { version = "1.43.1", features = ["full"] }
tracing-core = "0.1.32"
treeline = "0.1.0"
uuid = "1.10.0"
