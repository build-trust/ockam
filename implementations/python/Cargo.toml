[package]
name = "ockam_in_rust_for_python"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
name = "ockam"
crate-type = ["cdylib"]
doc = false

[dependencies]
miette = "7.5.0"
ockam = { path = "../rust/ockam/ockam", version = "^0.154.0" }
ockam_api = { path = "../rust/ockam/ockam_api", version = "^0.97.0" }
once_cell = "1.21.3"
pyo3 = { version = "0.24.1", features = ["abi3-py312", "experimental-async", "serde"] }
pyo3-async-runtimes = { git = "https://github.com/davide-baldo/pyo3-async-runtimes.git", branch = "davide-baldo/avoid-gil-in-async-threads", features = ["attributes", "tokio-runtime"] }
rmcp = { version = "0.1.5", features = ["transport-sse", "client", "transport-sse-server", "server"] }
serde = "1.0.219"
serde-pyobject = "0.6.1"
serde_json = "1.0.140"
tokio-util = "0.7"
tracing = { version = "0.1", default-features = false }

[features]
default = []
